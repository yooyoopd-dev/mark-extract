# Windows 빌드와 릴리스.
#
# 개발은 리눅스 컨테이너에서 하지만 제품은 Windows 단일 실행 파일이다. 동봉 JRE
# 와 한글 인코딩은 Windows 에서 확인되어야 의미가 있어, 여기서 빌드한다.
#
# 검증 두 판이 모두 통과하면 프리릴리스로 게시한다. 아티팩트는 90일 뒤 사라지고
# 로그인해야 받을 수 있지만 릴리스는 남고 링크 하나로 받는다 — 사내 PC 에서
# 확인해야 하는 프로젝트라 이 차이가 크다.
name: build

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

# 새로 밀면 이전 실행은 버린다. 러너 시간을 아끼고 결과가 헷갈리지 않는다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: 리눅스 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-24.04 러너는 AppArmor 로 비특권 user namespace 를 막는데, 그러면
      # Chromium 샌드박스가 뜨지 못하고 Electron 이 SIGTRAP 으로 죽는다.
      # --no-sandbox 로 우회하면 스모크가 확인하려던 sandbox: true 의 의미가
      # 없어지므로 러너 쪽 제한을 푼다.
      - name: Chromium 샌드박스 허용
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci
      - run: npm run resources
      - run: npm run jre

      # Electron 창을 띄우려면 디스플레이가 있어야 한다.
      - name: 검증 (토큰 · 빌드 · 스모크 · 파서 · 큐 · LLM · 설정 · OCR)
        run: xvfb-run -a npm run verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verify-${{ github.sha }}
          path: |
            out/verify/
            out/smoke/
          if-no-files-found: warn

  debug-windows:
    name: Windows 디버그 빌드
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npm run resources

      # 러너의 JDK 로 만들므로 Windows 용 런타임이 나온다.
      - name: 경량 JRE 생성 (Windows)
        run: npm run jre

      # 이 job 의 핵심. Windows 에서 동봉 JRE 로 한글 PDF 가 변환되는지 본다.
      - name: 파서 검증 (Windows)
        run: npm run verify:parsers

      # 리눅스 CI 는 cmd.exe 경로를 밟을 수 없다. npm 전역 설치가 내놓는 것과 같은
      # `.cmd` 셰임을 만들어 돌리므로, Windows 가 배치 파일을 직접 spawn 하지 못하는
      # 문제(build.10 의 spawn EINVAL)가 여기서만 잡힌다.
      - name: LLM 검증 (Windows — `.cmd` 셰임 실행 경로)
        run: npm run verify:llm

      # 동봉 JRE 로 진짜 CLI 를 돌리는 단언이 들어 있다. Windows 에서도 봐야 한다.
      - name: OCR 검증 (Windows)
        run: npm run verify:ocr

      - name: portable exe 빌드
        run: npm run dist:win

      # 패키징 뒤에야 process.resourcesPath 경로가 검증된다. 개발 경로와 다르므로
      # 여기서 깨지면 배포본이 동봉 JRE 를 못 찾는다는 뜻이다.
      #
      # 먼저 배치를 확인하고, 그 다음 실제로 돌린다. 배치 확인은 결정적이고
      # 빠르므로 실행이 어긋났을 때 원인을 가려 준다.
      - name: 패키징 배치 확인
        shell: pwsh
        run: |
          $missing = @()
          $want = @(
            "dist/win-unpacked/resources/jre/bin/java.exe",
            "dist/win-unpacked/resources/lib/opendataloader-pdf-cli.jar"
          ) + @("pdf", "docx", "xlsx", "xls", "pptx" | ForEach-Object {
            "dist/win-unpacked/resources/fixtures/sample-ko.$_"
          })
          foreach ($p in $want) {
            if (-not (Test-Path $p)) { $missing += $p } else { Write-Host "있음: $p" }
          }
          if ($missing.Count -gt 0) { throw "패키징에 빠진 파일: $($missing -join ', ')" }

          # 쓰지 않는 의존성이 실제로 빠졌는지. Windows 에서는 onnxruntime-node 와
          # sharp 가 설치되므로 여기서 걸러지지 않으면 용량이 크게 는다.
          $asar = "dist/win-unpacked/resources/app.asar"
          $listed = npx asar list $asar
          foreach ($pkg in @("pdfjs-dist", "@hyzyla", "@modelcontextprotocol", "onnxruntime-node", "sharp")) {
            if ($listed -match [regex]::Escape("/node_modules/$pkg/")) {
              throw "패키징에서 빠졌어야 할 의존성이 들어 있습니다: $pkg"
            }
          }
          Write-Host "제외 확인: pdfjs-dist, @hyzyla, @modelcontextprotocol, onnxruntime-node, sharp"
          Write-Host ("asar 크기: {0:N1} MB" -f ((Get-Item $asar).Length / 1MB))

      - name: 패키징된 앱 자체 점검
        shell: pwsh
        run: |
          # Electron 은 GUI 서브시스템이라 & 로 부르면 콘솔에 붙지 않아 출력이
          # 사라지고 대기 동작도 다르다. 핸들을 직접 넘겨 받고 시간 제한을 둔다.
          $exe = (Get-ChildItem dist/win-unpacked/*.exe | Select-Object -First 1).FullName
          Write-Host "실행: $exe --self-test"
          $out = "out/verify/self-test-windows.txt"
          $err = "out/verify/self-test-windows.err.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            Get-Content $out -ErrorAction SilentlyContinue | Write-Host
            throw "자체 점검이 180초를 넘겨 중단되었습니다."
          }
          Get-Content $out -ErrorAction SilentlyContinue | Write-Host
          Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { throw "자체 점검 실패 (exit $($p.ExitCode))" }

      # 여기까지는 압축을 풀어 놓은 디렉터리(win-unpacked)를 봤다. 그런데 사용자가
      # 받는 것은 `dist/*.exe` — 자기 압축 해제 단일 실행 파일이고, 그쪽은 지금까지
      # CI 에서 한 번도 실행된 적이 없다. 배포하는 바로 그 파일을 돌린다.
      #
      # PATH 에서 JDK 를 빼고 돌린다. 러너에는 setup-java 로 JDK 21 이 깔려 있어,
      # 어댑터가 동봉 JRE 대신 시스템 java 로 새도 그냥 초록이 뜬다. "Java 가 없는
      # PC" 라는 전제는 이렇게 해야 증명된다.
      - name: 배포하는 단일 exe 자체 점검 (Java 없는 PATH)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/verify | Out-Null
          $exe = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "exe: $exe"
          Write-Host "exe 크기: $mb MB"
          "$mb" | Out-File -Encoding utf8 out/verify/exe-size-mb.txt

          $env:JAVA_HOME = ""
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)jdk|jre|\\java' }) -join ';'
          if (Get-Command java -ErrorAction SilentlyContinue) {
            throw "PATH 에서 java 를 빼지 못했습니다 — 이 점검은 의미가 없습니다."
          }
          Write-Host "PATH 에 java 없음 — 확인"

          # 두 번 돌린다. 두 번째가 빨라지면 압축 해제 결과를 재사용한다는 뜻이고,
          # 그러면 "첫 실행만 느리다"가 사실이 된다.
          #
          # 출력은 --self-test-out 으로 파일에서 받는다. NSIS 스텁이 한 겹 끼어
          # 있어 리다이렉트한 stdout 에는 한 글자도 오지 않는다 (run 18 실측 —
          # exit 0 인데 파일이 비었다).
          $verify = (Resolve-Path out/verify).Path
          $results = @()
          foreach ($run in 1, 2) {
            $log = Join-Path $verify "portable-self-test-$run.txt"
            $err = Join-Path $verify "portable-self-test-$run.err.txt"
            Remove-Item $log -ErrorAction SilentlyContinue
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList '--self-test', '--self-test-out', $log -PassThru `
                   -RedirectStandardOutput "$err.stdout" -RedirectStandardError $err -WindowStyle Hidden
            if (-not $p.WaitForExit(300000)) {
              $p.Kill()
              throw "단일 exe 자체 점검이 300초를 넘겨 중단되었습니다 ($run 회차)."
            }
            $sw.Stop()
            $results += [pscustomobject]@{ Run = $run; Sec = [math]::Round($sw.Elapsed.TotalSeconds, 1); Exit = $p.ExitCode }
            Write-Host "--- $run 회차 ($($sw.Elapsed.TotalSeconds.ToString('0.0'))초, exit $($p.ExitCode)) ---"
            Get-Content $log -ErrorAction SilentlyContinue | Write-Host
            Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          }

          $text = Get-Content (Join-Path $verify "portable-self-test-1.txt") -Raw -ErrorAction SilentlyContinue
          if (-not $text) {
            throw "단일 exe 가 --self-test-out 파일을 남기지 않았습니다. 인자가 앱까지 가지 않거나 자체 점검이 그 전에 죽습니다."
          }
          if ($results[0].Exit -ne 0) { throw "단일 exe 자체 점검 실패 (exit $($results[0].Exit))" }
          if ($text -notmatch '동봉 JRE') { throw "동봉 JRE 를 쓰지 않았습니다 — 시스템 java 로 샜습니다." }
          if ($text -notmatch '5/5 성공') { throw "다섯 형식을 모두 변환하지 못했습니다." }

          Write-Host ("첫 실행 {0}초 · 두 번째 {1}초 · exe {2} MB" -f $results[0].Sec, $results[1].Sec, $mb)
          "첫 실행 $($results[0].Sec)초 / 두 번째 $($results[1].Sec)초 / exe $mb MB" |
            Out-File -Encoding utf8 out/verify/portable-timing.txt

      - name: 변환 결과·로그 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-verify-${{ github.sha }}
          path: out/verify/
          if-no-files-found: warn

      - name: 디버그 앱 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkExtract-debug-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: 프리릴리스 게시
    needs: [verify-linux, debug-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 릴리스를 만들려면 쓰기 권한이 필요하다. 이 job 에만 준다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 결과 내려받기
        uses: actions/download-artifact@v4
        with:
          name: MarkExtract-debug-${{ github.sha }}
          path: release

      - name: 자체 점검 결과 내려받기
        uses: actions/download-artifact@v4
        with:
          name: parser-verify-${{ github.sha }}
          path: verify

      - name: 릴리스 노트 작성
        id: notes
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}-build.${{ github.run_number }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=Mark Extract ${version} (빌드 ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

          {
            echo "정식 배포가 아닌 **동작 확인용 빌드**입니다. 커밋 \`${GITHUB_SHA::7}\` 에서 나왔습니다."
            echo
            echo "## 받는 법"
            echo
            echo "아래 \`MarkExtract-${version}.exe\` 를 내려받아 그대로 실행합니다. 설치 과정이 없고"
            echo "Java 를 따로 깔지 않아도 됩니다 — 경량 JRE 가 실행 파일 안에 들어 있습니다."
            echo
            echo "서명하지 않은 실행 파일이라 SmartScreen 이 막을 수 있습니다."
            echo "\"추가 정보\" → \"실행\" 으로 넘어갑니다."
            echo
            echo "## 첫 실행이 느린 이유"
            echo
            echo "단일 exe 는 **실행할 때마다** 자기 압축을 \`%TEMP%\` 로 풉니다(약 660MB)."
            echo "CI 실측으로 그 구간이 첫 실행 20초대, 이후 13초 안팎입니다. 사내 PC 에서는"
            echo "백신의 전수 검사가 겹쳐 더 걸립니다. 그 동안에는 앱 로고가 담긴 작은 창만"
            echo "뜹니다 — 멈춘 것이 아닙니다."
            echo
            echo '```'
            cat verify/portable-timing.txt 2>/dev/null || echo "(측정값 없음)"
            echo '```'
            echo
            echo "## 확인된 것"
            echo
            echo "- 리눅스: 토큰 대조, Electron 셸 스모크, 파서 5종, 변환 큐·감시 폴더·내보내기"
            echo "- Windows: 동봉 JRE 로 한글 문서 5종 변환, 패키징 배치, 패키징된 앱 자체 점검"
            echo "- Windows: **배포하는 단일 exe 를 PATH 에서 JDK 를 뺀 채** 돌려 동봉 JRE 사용과 5종 변환 확인"
            echo
            echo "아직 확인되지 않은 것: 실제 OCR 인식 결과, gemini·codex 의 성공 응답 본문,"
            echo "Ollama 실동작. 개발 환경에서 모델·인증에 닿을 수 없어 남겨 두었습니다."
            echo
            echo "## Windows 자체 점검 출력"
            echo
            echo '```'
            cat verify/self-test-windows.txt 2>/dev/null || echo "(없음)"
            echo '```'
          } > release-notes.md

      - name: 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.notes.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.notes.outputs.title }}" \
            --notes-file release-notes.md \
            --prerelease \
            release/*.exe
