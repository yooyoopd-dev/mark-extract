# Windows 동작 확인용 디버그 빌드.
#
# 개발은 리눅스 컨테이너에서 하지만 제품은 Windows 단일 실행 파일이다. 동봉 JRE
# 와 한글 인코딩은 Windows 에서 확인되어야 의미가 있어, 여기서 빌드해 아티팩트로
# 올린다. 내려받아 직접 실행해 보면 된다.
name: build

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

# 새로 밀면 이전 실행은 버린다. 러너 시간을 아끼고 결과가 헷갈리지 않는다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: 리눅스 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-24.04 러너는 AppArmor 로 비특권 user namespace 를 막는데, 그러면
      # Chromium 샌드박스가 뜨지 못하고 Electron 이 SIGTRAP 으로 죽는다.
      # --no-sandbox 로 우회하면 스모크가 확인하려던 sandbox: true 의 의미가
      # 없어지므로 러너 쪽 제한을 푼다.
      - name: Chromium 샌드박스 허용
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci
      - run: npm run resources
      - run: npm run jre

      # Electron 창을 띄우려면 디스플레이가 있어야 한다.
      - name: 검증 (토큰 · 빌드 · 셸 스모크 · PDF)
        run: xvfb-run -a npm run verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verify-${{ github.sha }}
          path: |
            out/verify/
            out/smoke/
          if-no-files-found: warn

  debug-windows:
    name: Windows 디버그 빌드
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npm run resources

      # 러너의 JDK 로 만들므로 Windows 용 런타임이 나온다.
      - name: 경량 JRE 생성 (Windows)
        run: npm run jre

      # 이 job 의 핵심. Windows 에서 동봉 JRE 로 한글 PDF 가 변환되는지 본다.
      - name: 파서 검증 (Windows)
        run: npm run verify:parsers

      - name: portable exe 빌드
        run: npm run dist:win

      # 패키징 뒤에야 process.resourcesPath 경로가 검증된다. 개발 경로와 다르므로
      # 여기서 깨지면 배포본이 동봉 JRE 를 못 찾는다는 뜻이다.
      #
      # 먼저 배치를 확인하고, 그 다음 실제로 돌린다. 배치 확인은 결정적이고
      # 빠르므로 실행이 어긋났을 때 원인을 가려 준다.
      - name: 패키징 배치 확인
        shell: pwsh
        run: |
          $missing = @()
          $want = @(
            "dist/win-unpacked/resources/jre/bin/java.exe",
            "dist/win-unpacked/resources/lib/opendataloader-pdf-cli.jar"
          ) + @("pdf", "docx", "xlsx", "xls", "pptx" | ForEach-Object {
            "dist/win-unpacked/resources/fixtures/sample-ko.$_"
          })
          foreach ($p in $want) {
            if (-not (Test-Path $p)) { $missing += $p } else { Write-Host "있음: $p" }
          }
          if ($missing.Count -gt 0) { throw "패키징에 빠진 파일: $($missing -join ', ')" }

          # 쓰지 않는 의존성이 실제로 빠졌는지. Windows 에서는 onnxruntime-node 와
          # sharp 가 설치되므로 여기서 걸러지지 않으면 용량이 크게 는다.
          $asar = "dist/win-unpacked/resources/app.asar"
          $listed = npx asar list $asar
          foreach ($pkg in @("pdfjs-dist", "@hyzyla", "@modelcontextprotocol", "onnxruntime-node", "sharp")) {
            if ($listed -match [regex]::Escape("/node_modules/$pkg/")) {
              throw "패키징에서 빠졌어야 할 의존성이 들어 있습니다: $pkg"
            }
          }
          Write-Host "제외 확인: pdfjs-dist, @hyzyla, @modelcontextprotocol, onnxruntime-node, sharp"
          Write-Host ("asar 크기: {0:N1} MB" -f ((Get-Item $asar).Length / 1MB))

      - name: 패키징된 앱 자체 점검
        shell: pwsh
        run: |
          # Electron 은 GUI 서브시스템이라 & 로 부르면 콘솔에 붙지 않아 출력이
          # 사라지고 대기 동작도 다르다. 핸들을 직접 넘겨 받고 시간 제한을 둔다.
          $exe = (Get-ChildItem dist/win-unpacked/*.exe | Select-Object -First 1).FullName
          Write-Host "실행: $exe --self-test"
          $out = "out/verify/self-test-windows.txt"
          $err = "out/verify/self-test-windows.err.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            Get-Content $out -ErrorAction SilentlyContinue | Write-Host
            throw "자체 점검이 180초를 넘겨 중단되었습니다."
          }
          Get-Content $out -ErrorAction SilentlyContinue | Write-Host
          Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { throw "자체 점검 실패 (exit $($p.ExitCode))" }

      - name: 변환 결과·로그 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-verify-${{ github.sha }}
          path: out/verify/
          if-no-files-found: warn

      - name: 디버그 앱 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkExtract-debug-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
