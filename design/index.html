<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkExtract — 문서 Markdown 추출기</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ============================================================
   Design tokens — tolaria (refactoringhq/tolaria) 파생
   ============================================================ */
:root, [data-theme="light"] {
  color-scheme: light;

  --surface-app:      #FFFFFF;
  --surface-sidebar:  #F7F6F3;
  --surface-panel:    #FCFBFA;
  --surface-card:     #FFFFFF;
  --surface-popover:  #FFFFFF;
  --surface-input:    #FFFFFF;
  --surface-button:   #EBEBEA;
  --surface-dialog:   #FFFFFF;
  --surface-code:     #F7F6F3;
  --surface-overlay:  rgba(0,0,0,.30);

  --text-primary:   #37352F;
  --text-secondary: #6B6A66;   /* 레퍼런스 #787774 대비 보정 — 웜 그라운드에서 5.1:1 확보 */
  --text-muted:     #8C8A84;
  --text-inverse:   #FFFFFF;

  --border-default: #E9E9E7;
  --border-subtle:  #EFEEEB;
  --border-strong:  #D9D9D6;
  --border-input:   #DCDBD7;

  --state-hover:         #EBEBEA;
  --state-hover-subtle:  #F0F0EF;
  --state-selected:      #E8F4FE;
  --state-selected-deep: #D8ECFE;
  --state-disabled:      #F0F0EF;

  --accent:        #155DFF;
  --accent-hover:  #0D4AD6;
  --accent-bg:     #EEF3FF;
  --accent-ring:   #155DFF;

  --ok-text:   #1E7A47;  --ok-bg:   #E7F4EC;
  --warn-text: #A85A08;  --warn-bg: #FCF0E2;
  --err-text:  #C5302F;  --err-bg:  #FCECEB;
  --run-text:  #1450DA;  --run-bg:  #E8F1FE;
  --idle-text: #6B6A66;  --idle-bg: #F0F0EF;

  --caption-close:      #C42B1C;
  --shadow-dialog:      rgba(15,15,15,.16);
  --shadow-popover:     rgba(15,15,15,.12);

  --tk-key: #C9383E; --tk-val: #2A7E4F; --tk-head: #0969DA; --tk-mark: #8C8A84; --tk-code: #C9383E;
}

[data-theme="dark"] {
  color-scheme: dark;

  --surface-app:      #1F1E1B;
  --surface-sidebar:  #191814;
  --surface-panel:    #1B1A17;
  --surface-card:     #23221F;
  --surface-popover:  #292823;
  --surface-input:    #1A1916;
  --surface-button:   #34322D;
  --surface-dialog:   #272622;
  --surface-code:     #191814;
  --surface-overlay:  rgba(8,8,7,.58);

  --text-primary:   #E6E1D8;
  --text-secondary: #B8B1A6;
  --text-muted:     #8F887D;
  --text-inverse:   #151411;

  --border-default: #34322D;
  --border-subtle:  #2A2925;
  --border-strong:  #46433B;
  --border-input:   #3A3832;

  --state-hover:         #2D2B27;
  --state-hover-subtle:  #262520;
  --state-selected:      #1D3354;
  --state-selected-deep: #244271;
  --state-disabled:      #262520;

  --accent:        #78A4FF;
  --accent-hover:  #9CBCFF;
  --accent-bg:     #1C2A44;
  --accent-ring:   #78A4FF;

  --ok-text:   #5FD39A;  --ok-bg:   #1B3227;
  --warn-text: #E9A35A;  --warn-bg: #362719;
  --err-text:  #FF8F88;  --err-bg:  #3A211F;
  --run-text:  #9CBCFF;  --run-bg:  #1C2A44;
  --idle-text: #B8B1A6;  --idle-bg: #2A2925;

  --caption-close:      #C42B1C;
  --shadow-dialog:      rgba(0,0,0,.55);
  --shadow-popover:     rgba(0,0,0,.45);

  --tk-key: #E8888C; --tk-val: #86D6A6; --tk-head: #8AB4F8; --tk-mark: #8F887D; --tk-code: #E8888C;
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: Inter, "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont,
               "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--surface-app);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--state-selected-deep); }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 14px; height: 14px; }

/* scrollbars — 데스크톱 밀도에 맞춘 얇은 형태 */
.od-scroll, .scroll { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.od-scroll::-webkit-scrollbar, .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.od-scroll::-webkit-scrollbar-thumb, .scroll::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 8px; border: 3px solid transparent; background-clip: content-box;
}

/* ============================================================
   App shell — 타이틀바 / 4분할 워크스페이스 / 상태바
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: 40px minmax(0, 1fr) 28px;
  height: 100vh;
  height: 100dvh;
  background: var(--surface-app);
}

/* --- Windows 캡션바 --- */
.titlebar {
  display: flex; align-items: stretch;
  background: var(--surface-sidebar);
  border-bottom: 1px solid var(--border-default);
  user-select: none;
}
.tb-brand { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; }
.tb-mark {
  width: 18px; height: 18px; border-radius: 5px; flex: none;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: -.3px;
}
.tb-name { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.tb-menu { display: flex; align-items: stretch; }
.tb-menu button {
  padding: 0 10px; font-size: 13px; color: var(--text-secondary); border-radius: 4px; margin: 5px 1px;
}
.tb-menu button:hover { background: var(--state-hover); color: var(--text-primary); }
.tb-drag { flex: 1 1 auto; min-width: 12px; }
.tb-right { display: flex; align-items: stretch; }
.tb-tool {
  display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; margin: 5px 2px;
  border-radius: 5px; font-size: 12px; color: var(--text-secondary);
}
.tb-tool:hover { background: var(--state-hover); color: var(--text-primary); }
.caption { display: flex; align-items: stretch; }
.caption button { width: 46px; display: grid; place-items: center; color: var(--text-primary); }
.caption button:hover { background: var(--state-hover); }
.caption button.close:hover { background: var(--caption-close); color: #fff; }
.caption svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.1; }
.nav-toggle { display: none; }

/* --- 워크스페이스 그리드 --- */
.workspace {
  position: relative;
  display: grid;
  grid-template-columns: 248px 336px minmax(0, 1fr) 300px;
  min-height: 0;
  background: var(--surface-app);
}
.workspace > * { min-width: 0; min-height: 0; }

/* ============================================================
   좌측 사이드바
   ============================================================ */
.sidebar {
  display: grid; grid-template-rows: minmax(0,1fr) auto;
  background: var(--surface-sidebar);
  border-right: 1px solid var(--border-default);
  transition: transform .22s cubic-bezier(.2,.7,.3,1);
}
.nav { padding: 8px 8px 16px; }
.nav-group + .nav-group { margin-top: 14px; }
.nav-head {
  display: flex; align-items: center; gap: 4px; width: 100%;
  padding: 4px 8px; margin-bottom: 2px; border-radius: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-muted);
}
.nav-head:hover { background: var(--state-hover); color: var(--text-secondary); }
.nav-head .chev { transition: transform .15s ease; }
.nav-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.nav-head .count { margin-left: auto; font-variant-numeric: tabular-nums; }
.nav-body { display: grid; gap: 1px; }
.nav-head[aria-expanded="false"] + .nav-body { display: none; }

.nav-item {
  position: relative; display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 30px; padding: 4px 8px 4px 10px; border-radius: 5px;
  font-size: 14px; color: var(--text-primary); text-align: left;
}
.nav-item:hover { background: var(--state-hover); }
.nav-item .label { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count {
  flex: none; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.nav-item[aria-current="true"] { background: var(--state-selected); color: var(--accent); font-weight: 500; }
.nav-item[aria-current="true"]::before {
  content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item[aria-current="true"] .count { color: var(--accent); }
.nav-item .pill {
  flex: none; min-width: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; text-align: center;
  font-variant-numeric: tabular-nums;
}

.fmt {
  flex: none; width: 26px; height: 16px; border-radius: 3px;
  display: grid; place-items: center; font-size: 8px; font-weight: 700; letter-spacing: .02em;
  color: #fff;
}
.fmt.pdf  { background: #C5302F; }
.fmt.docx { background: #2B5797; }
.fmt.xlsx { background: #1E7A47; }
.fmt.pptx { background: #A85A08; }
.fmt.lg { width: 32px; height: 20px; font-size: 9px; border-radius: 4px; }

.sidebar-foot { border-top: 1px solid var(--border-default); padding: 8px; }
.watch-add {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px;
  padding: 4px 10px; border-radius: 5px; font-size: 13px; color: var(--text-secondary);
}
.watch-add:hover { background: var(--state-hover); color: var(--text-primary); }

/* ============================================================
   중앙 문서 리스트
   ============================================================ */
.listpane {
  display: grid; grid-template-rows: auto auto minmax(0,1fr);
  background: var(--surface-panel);
  border-right: 1px solid var(--border-default);
}
.list-head {
  display: flex; align-items: center; gap: 6px;
  height: 44px; padding: 0 8px 0 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.list-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin-right: auto; }
.icon-btn {
  display: inline-grid; place-items: center; width: 28px; height: 28px;
  border-radius: 5px; color: var(--text-secondary);
}
.icon-btn:hover { background: var(--state-hover); color: var(--text-primary); }
.icon-btn[aria-pressed="true"], .icon-btn.on { background: var(--state-selected); color: var(--accent); }
.icon-btn:disabled { color: var(--text-muted); cursor: not-allowed; }
.icon-btn:disabled:hover { background: none; }

.list-filter { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); display: grid; gap: 8px; }
.search {
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 8px; border-radius: 6px;
  background: var(--surface-input); border: 1px solid var(--border-input); color: var(--text-secondary);
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.search input { flex: 1 1 0; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; color: var(--text-primary); }
.search input::placeholder { color: var(--text-muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 24px; padding: 0 10px; border-radius: 12px;
  border: 1px solid var(--border-default); background: var(--surface-card);
  font-size: 12px; color: var(--text-secondary); white-space: nowrap;
}
.chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
.chip[aria-pressed="true"] { background: var(--state-selected); border-color: transparent; color: var(--accent); font-weight: 500; }

.doclist { padding: 4px 0 16px; }
.doc {
  position: relative; display: block; width: 100%; text-align: left;
  padding: 11px 14px 11px 16px; border-bottom: 1px solid var(--border-subtle);
  background: none; color: inherit;
}
.doc:hover { background: var(--state-hover-subtle); }
.doc[aria-selected="true"] { background: var(--state-selected); }
.doc[aria-selected="true"]::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
}
.doc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.doc-name {
  flex: 1 1 0; min-width: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.doc-star { flex: none; color: var(--warn-text); }
.doc-snip { font-size: 12.5px; line-height: 1.45; color: var(--text-secondary); margin-bottom: 8px; }
.doc-foot { display: flex; align-items: center; gap: 8px; }
.doc-time { margin-left: auto; flex: none; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }

.status {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  height: 20px; padding: 0 7px; border-radius: 4px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.status .icon { width: 12px; height: 12px; stroke-width: 1.8; }
.status.done   { background: var(--ok-bg);   color: var(--ok-text); }
.status.run    { background: var(--run-bg);  color: var(--run-text); }
.status.queued { background: var(--idle-bg); color: var(--idle-text); }
.status.failed { background: var(--err-bg);  color: var(--err-text); }
.status.run .icon { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bar { height: 3px; border-radius: 2px; background: var(--border-default); overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .35s ease-out; }

.skel { padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
.skel > span { display: block; height: 10px; border-radius: 4px; background: var(--state-hover); animation: pulse 1.4s ease-in-out infinite; }
.skel > span + span { margin-top: 8px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

.empty { display: grid; justify-items: center; gap: 8px; padding: 56px 28px; text-align: center; }
.empty .ring {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--state-hover-subtle); color: var(--text-secondary);
}
.empty h3 { margin: 4px 0 0; font-size: 14px; font-weight: 600; }
.empty p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--text-secondary); max-width: 34ch; }

/* ============================================================
   메인 뷰어
   ============================================================ */
.viewer { display: grid; grid-template-rows: auto auto minmax(0,1fr); background: var(--surface-app); }
.viewer-bar {
  display: flex; align-items: center; gap: 4px;
  height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border-subtle);
}
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; margin-right: auto; }
.crumbs .seg { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.crumbs .sep { color: var(--text-muted); }
.crumbs .cur {
  font-size: 13px; color: var(--text-primary); font-weight: 500;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0;
}
.vbar-div { width: 1px; height: 18px; background: var(--border-default); margin: 0 4px; flex: none; }
.back-to-list, .inspector-open { display: none; }

.tabs { display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border-default); }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px; border-radius: 5px 5px 0 0;
  font-size: 13px; color: var(--text-secondary);
}
.tab:hover { background: var(--state-hover-subtle); color: var(--text-primary); }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px;
  background: var(--accent); border-radius: 2px 2px 0 0;
}
.tab .n { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .n { color: var(--accent); }

.dirty {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; background: var(--warn-bg); color: var(--warn-text);
  font-size: 12.5px; border-bottom: 1px solid var(--border-subtle);
}
.dirty .btn-mini {
  margin-left: auto; height: 24px; padding: 0 10px; border-radius: 5px;
  background: var(--warn-text); color: #fff; font-size: 12px; font-weight: 600;
}

/* 렌더링된 Markdown — 리딩 영역 16px/1.6 */
.reading { padding: 32px 40px 80px; }
.reading-inner { max-width: 72ch; margin: 0 auto; font-size: 16px; line-height: 1.65; }
.reading-inner h1 { font-size: 28px; line-height: 1.3; font-weight: 700; letter-spacing: -.02em; margin: 0 0 16px; }
.reading-inner h2 { font-size: 21px; line-height: 1.35; font-weight: 700; letter-spacing: -.015em; margin: 32px 0 10px; }
.reading-inner h3 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; }
.reading-inner h4 { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin: 20px 0 6px; }
.reading-inner p { margin: 0 0 14px; }
.reading-inner ul, .reading-inner ol { margin: 0 0 14px; padding-left: 22px; }
.reading-inner li { margin-bottom: 5px; }
.reading-inner li::marker { color: var(--accent); }

.reading-inner strong { font-weight: 650; }
.reading-inner code {
  font-family: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  font-size: .87em; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-code); color: var(--tk-code);
}
.reading-inner pre {
  margin: 0 0 16px; padding: 14px 16px; border-radius: 8px; overflow-x: auto;
  background: var(--surface-code); border: 1px solid var(--border-subtle);
}
.reading-inner pre code { background: none; padding: 0; color: var(--text-primary); font-size: 13px; line-height: 1.6; }
.reading-inner blockquote {
  margin: 0 0 16px; padding: 2px 0 2px 16px;
  border-left: 3px solid var(--border-strong); color: var(--text-secondary);
}
.reading-inner hr { border: 0; border-top: 1px solid var(--border-default); margin: 28px 0; }
.reading-inner table { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 14px; display: block; overflow-x: auto; }
.reading-inner th, .reading-inner td { border: 1px solid var(--border-default); padding: 8px 12px; text-align: left; vertical-align: top; }
.reading-inner th { background: var(--surface-sidebar); font-weight: 600; white-space: nowrap; }
.reading-inner tbody tr:nth-child(2n) td { background: var(--surface-panel); }
.fm {
  display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 24px;
  padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle);
}
.fm .kv {
  display: inline-flex; align-items: baseline; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: 4px;
  background: var(--surface-sidebar); border: 1px solid var(--border-subtle); font-size: 11.5px;
}
.fm .kv b { font-weight: 600; color: var(--tk-key); }
.fm .kv span { color: var(--text-secondary); }
.imgref {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 0 14px;
  padding: 6px 10px; border-radius: 6px; border: 1px dashed var(--border-strong);
  background: var(--surface-panel); color: var(--text-secondary); font-size: 12.5px;
}

/* 원본 Markdown 소스 */
.source { padding: 20px 24px 80px; }
.source pre {
  margin: 0; font-family: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  font-size: 13px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--text-primary); tab-size: 2;
}
.tk-h { color: var(--tk-head); font-weight: 600; }
.tk-b { color: var(--text-primary); font-weight: 700; }
.tk-c { color: var(--tk-code); }
.tk-m { color: var(--tk-mark); }
.tk-t { color: var(--tk-val); }
.tk-q { color: var(--text-secondary); font-style: italic; }
.tk-f { color: var(--tk-key); }

/* 추출 필드 */
.fields { padding: 20px 24px 80px; max-width: 900px; }
.fields h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.fields .hint { margin: 0 0 16px; font-size: 12.5px; color: var(--text-secondary); }
.ftable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ftable tr { border-bottom: 1px solid var(--border-subtle); }
.ftable tr:first-child { border-top: 1px solid var(--border-subtle); }
.ftable th {
  width: 190px; padding: 10px 16px 10px 0; text-align: left; vertical-align: top;
  font-weight: 500; color: var(--text-secondary); white-space: nowrap;
}
.ftable td { padding: 10px 0; vertical-align: top; overflow-wrap: anywhere; }
.conf { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.conf i { display: block; width: 28px; height: 4px; border-radius: 2px; background: var(--border-default); overflow: hidden; }
.conf i b { display: block; height: 100%; background: var(--ok-text); }

/* 실패 상태 */
.failbox { margin: 32px auto; max-width: 560px; padding: 20px; border-radius: 8px; background: var(--err-bg); border: 1px solid color-mix(in srgb, var(--err-text) 30%, transparent); }
.failbox h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--err-text); display: flex; align-items: center; gap: 8px; }
.failbox p { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: var(--text-primary); }
.failbox dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 16px; font-size: 12.5px; }
.failbox dt { color: var(--text-secondary); }
.failbox dd { margin: 0; }

/* ============================================================
   우측 인스펙터
   ============================================================ */
.inspector {
  display: grid; grid-template-rows: auto minmax(0,1fr);
  background: var(--surface-sidebar); border-left: 1px solid var(--border-default);
  transition: transform .22s cubic-bezier(.2,.7,.3,1);

.insp-head { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border-default); }
.insp-head h2 { margin: 0; font-size: 13px; font-weight: 600; margin-right: auto; }
.insp-body { padding: 4px 16px 28px; }
.insp-sec + .insp-sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-default); }
.insp-sec > h3 {
  margin: 14px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted);
}
.meta { display: grid; gap: 7px; font-size: 12.5px; }
.meta > div { display: flex; align-items: baseline; gap: 10px; }
.meta dt, .meta .k { flex: none; width: 74px; color: var(--text-secondary); }
.meta dd, .meta .v { margin: 0; flex: 1 1 0; min-width: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.opt { display: grid; gap: 4px; margin-bottom: 14px; }
.opt > label, .opt > .lab { font-size: 12.5px; font-weight: 500; }

  width: 100%; height: 30px; padding: 0 8px; border-radius: 6px;
  background: var(--surface-input); border: 1px solid var(--border-input); color: var(--text-primary); font-size: 13px;
}
.opt select:focus, .opt input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.switchrow { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.switchrow .txt { flex: 1 1 0; min-width: 0; }
.switchrow .txt b { display: block; font-size: 12.5px; font-weight: 500; }
.switchrow .txt span { display: block; font-size: 11.5px; line-height: 1.4; color: var(--text-secondary); }
.sw {
  position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px;
  background: var(--border-strong); transition: background .15s ease;
}
.sw::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s ease;
}
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(14px); }
.rangerow { display: grid; gap: 6px; margin-bottom: 14px; }

.btn {

  height: 32px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--border-input); background: var(--surface-card);
  font-size: 13px; font-weight: 500; color: var(--text-primary);
}
.btn:hover { background: var(--state-hover); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--err-text); border-color: color-mix(in srgb, var(--err-text) 35%, transparent); }
.btn.danger:hover { background: var(--err-bg); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface-card); }

/* ============================================================
   상태바
   ============================================================ */
.statusbar {
  display: flex; align-items: center; gap: 2px;
  padding: 0 4px 0 8px; background: var(--surface-sidebar);
  border-top: 1px solid var(--border-default); font-size: 11.5px; color: var(--text-secondary);
}
.sb {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border-radius: 4px; color: inherit; white-space: nowrap; font-variant-numeric: tabular-nums;
}
button.sb:hover { background: var(--state-hover); color: var(--text-primary); }
.sb .icon { width: 12px; height: 12px; }
.sb .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ok-text); }

.sb-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.sb-hide { display: inline-flex; }

.scrim {
  position: absolute; inset: 0; background: var(--surface-overlay); z-index: 25;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.app[data-sidebar="open"] .scrim, .app[data-inspector="open"] .scrim { opacity: 1; pointer-events: auto; }
@media (min-width: 1201px) { .app[data-inspector="open"] .scrim { opacity: 0; pointer-events: none; } }
@media (min-width: 1025px) { .app[data-sidebar="open"] .scrim { opacity: 0; pointer-events: none; } }

.overlay {
  position: fixed; inset: 0; z-index: 60; display: grid; background: var(--surface-overlay);
  animation: fade .16s ease-out;
}
.overlay[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } }

.palette {

}

.palette-in kbd { flex: none; }
.palette-list { max-height: min(420px, 52vh); overflow-y: auto; padding: 6px; }
.palette-group { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.pcmd {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px;
  padding: 6px 10px; border-radius: 6px; text-align: left; color: var(--text-primary);
}
.pcmd .t { flex: 1 1 0; min-width: 0; font-size: 13.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pcmd .s { flex: none; font-size: 11.5px; color: var(--text-muted); }
.pcmd[data-active="true"] { background: var(--state-selected); color: var(--accent); }
.pcmd[data-active="true"] .s { color: var(--accent); }
.palette-foot { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border-default); background: var(--surface-sidebar); font-size: 11.5px; color: var(--text-secondary); }
kbd {
  display: inline-block; min-width: 18px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--border-strong); border-bottom-width: 2px;
  background: var(--surface-card); font-family: inherit; font-size: 11px; color: var(--text-secondary); text-align: center;
}

.dialog {
  place-self: center; width: min(440px, 92vw);
  background: var(--surface-dialog); border: 1px solid var(--border-default); border-radius: 10px;
  box-shadow: 0 18px 48px var(--shadow-dialog); animation: rise .18s cubic-bezier(.2,.7,.3,1);
}

.dialog .sub { margin: 0; padding: 0 20px 14px; font-size: 13px; color: var(--text-secondary); }
.dialog .body { padding: 0 20px 4px; }
.dialog .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 20px 18px; }
fieldset { border: 0; margin: 0 0 16px; padding: 0; }
legend { padding: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.radio, .check {
  display: flex; align-items: flex-start; gap: 10px; min-height: 36px; padding: 7px 10px;
  border-radius: 6px; cursor: pointer;
}
.radio:hover, .check:hover { background: var(--state-hover-subtle); }
.radio input, .check input { margin: 2px 0 0; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.radio .txt b, .check .txt b { display: block; font-size: 13px; font-weight: 500; }
.radio .txt span, .check .txt span { display: block; font-size: 11.5px; line-height: 1.4; color: var(--text-secondary); }

.drop {
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 10%, var(--surface-overlay));
}
.drop[hidden] { display: none; }
.drop-in {
  display: grid; justify-items: center; gap: 10px; padding: 36px 48px;
  border: 2px dashed var(--accent); border-radius: 14px;
  background: var(--surface-dialog); color: var(--text-primary); text-align: center;
}
.drop-in b { font-size: 16px; font-weight: 650; }
.drop-in span { font-size: 13px; color: var(--text-secondary); }
.drop-in .icon { width: 30px; height: 30px; color: var(--accent); }

.toasts { position: fixed; right: 16px; bottom: 40px; z-index: 80; display: grid; gap: 8px; justify-items: end; }
.toast {
  display: flex; align-items: center; gap: 10px; max-width: 380px;
  padding: 10px 14px; border-radius: 8px;
  background: var(--surface-dialog); border: 1px solid var(--border-default);
  box-shadow: 0 8px 24px var(--shadow-popover); font-size: 13px;
  animation: rise .2s cubic-bezier(.2,.7,.3,1);
}
.toast.ok .icon { color: var(--ok-text); }
.toast.err .icon { color: var(--err-text); }
.toast b { font-weight: 600; }
.toast .sub2 { display: block; font-size: 11.5px; color: var(--text-secondary); }

/* ============================================================
   반응형 — 1440 / 1200 / 1024 / 768
   ============================================================ */
@media (max-width: 1440px) {
  .workspace { grid-template-columns: 232px 312px minmax(0,1fr) 284px; }
  .reading { padding: 28px 32px 72px; }
}
@media (max-width: 1200px) {

}

  .workspace { grid-template-columns: minmax(0,1fr); }
  .listpane, .viewer { display: none; }

  .app[data-pane="viewer"] .viewer { display: grid; }

  .back-to-list { display: inline-grid; }
  .sidebar { width: min(248px, 82vw); }
  .inspector { width: min(300px, 88vw); }
  .reading { padding: 24px 20px 64px; }
  .reading-inner { font-size: 16px; }
  .reading-inner h1 { font-size: 24px; }
  .tb-menu { display: none; }
}
@media (max-width: 520px) {
  .tb-name { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

# Attention Is All You Need

## Abstract

지배적인 시퀀스 변환 모델은 인코더와 디코더를 포함하는 복잡한 순환 신경망 또는 합성곱 신경망에 기반한다. 본 논문은 순환과 합성곱을 완전히 배제하고 **어텐션 메커니즘에만** 기반한 새로운 단순 네트워크 아키텍처 *Transformer* 를 제안한다.

## 1. Introduction

순환 모델은 일반적으로 입력과 출력 시퀀스의 기호 위치를 따라 계산을 분해한다. 이러한 본질적인 순차성은 학습 예제 내에서의 병렬화를 배제하며, 이는 시퀀스 길이가 길어질수록 치명적이 된다.

## 2. Background

순차 계산을 줄이려는 목표는 Extended Neural GPU, ByteNet, ConvS2S의 기반을 형성한다. 이들 모두 합성곱 신경망을 기본 구성 요소로 사용한다.

> Self-attention은 시퀀스의 표현을 계산하기 위해 단일 시퀀스의 서로 다른 위치를 연관시키는 어텐션 메커니즘이다.

## 3. Model Architecture

### 3.1 Encoder and Decoder Stacks

- **Encoder** — 동일한 6개 레이어의 스택. 각 레이어는 multi-head self-attention과 position-wise feed-forward 네트워크 두 개의 하위 계층을 가진다.
- **Decoder** — 마찬가지로 6개 레이어. 인코더 출력에 대해 multi-head attention을 수행하는 세 번째 하위 계층이 추가된다.

### 3.2 Attention

Scaled Dot-Product Attention은 다음과 같이 계산된다.

\`\`\`text
Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V
\`\`\`

Multi-Head Attention은 \`h = 8\` 개의 병렬 어텐션 헤드를 사용하며, 각 헤드의 차원은 \`d_k = d_v = d_model / h = 64\` 이다.

![그림 2: Scaled Dot-Product Attention과 Multi-Head Attention](images/figure-2.png)

## 4. Why Self-Attention

| 레이어 종류 | 레이어당 복잡도 | 순차 연산 | 최대 경로 길이 |
| --- | --- | --- | --- |
| Self-Attention | O(n²·d) | O(1) | O(1) |
| Recurrent | O(n·d²) | O(n) | O(n) |
| Convolutional | O(k·n·d²) | O(1) | O(log_k n) |
| Self-Attention (restricted) | O(r·n·d) | O(1) | O(n/r) |

## 5. Training

모델은 450만 개 문장 쌍으로 구성된 WMT 2014 영어-독일어 데이터셋으로 학습되었다. 8개의 NVIDIA P100 GPU에서 기본 모델은 12시간, 대형 모델은 3.5일 학습되었다.

## 6. Results

| 모델 | EN-DE BLEU | EN-FR BLEU | 학습 비용 (FLOPs) |
| --- | --- | --- | --- |
| ByteNet | 23.75 | — | — |
| GNMT + RL | 24.6 | 39.92 | 1.4 × 10²⁰ |
| ConvS2S | 25.16 | 40.46 | 1.5 × 10²⁰ |
| **Transformer (big)** | **28.4** | **41.8** | 2.3 × 10¹⁹ |

## 7. Conclusion

본 논문은 전적으로 어텐션에 기반한 최초의 시퀀스 변환 모델을 제시했다. 번역 작업에서 Transformer는 순환 또는 합성곱 계층 기반 아키텍처보다 훨씬 빠르게 학습될 수 있다.`

function splitFrontmatter(src) {
  const m = src.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return { fm: null, body: src };
  const fm = m[1].split("\n").filter(Boolean).map((l) => {
    const i = l.indexOf(":");
    return i < 0 ? null : [l.slice(0, i).trim(), l.slice(i + 1).trim()];
  }).filter(Boolean);
  return { fm, body: src.slice(m[0].length) };
}

function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) =>
      `<span class="imgref">${icon("i-image", "icon icon-sm")}<span>이미지 참조 · ${esc(src)}${alt ? " — " + esc(alt) : ""}</span></span>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function renderMd(src) {
  const lines = src.split("\n");
  const out = [];
  let i = 0;
  const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const isBlock = (l) => /^(#{1,6}\s|\s*[-*]\s|\s*\d+\.\s|\||>|```|---+\s*$)/.test(l);

  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) {
      const n = Math.min(m[1].length, 4);
      out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue;
    }
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue;
    }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const head = cells(rows[0]);
      const body = rows.slice(/^\|[\s:|-]+\|$/.test(rows[1] || "") ? 2 : 1);
      out.push(
        `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
      ); continue;
    }
    if (/^\s*[-*]\s+/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      out.push(`<ul>${buf.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`); continue;
    }
    if (/^\s*\d+\.\s+/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*\d+\.\s+/, ""));
      out.push(`<ol>${buf.map((x) => `<li>${inline(x)}</li>`).join("")}</ol>`); continue;
    }
    if (/^---+\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}

function highlightMd(src) {
  return esc(src)
    .replace(/^(---)$/gm, '<span class="tk-f">$1</span>')
    .replace(/^(#{1,6} .*)$/gm, '<span class="tk-h">$1</span>')
    .replace(/^(&gt; .*)$/gm, '<span class="tk-q">$1</span>')
    .replace(/^(\|.*)$/gm, '<span class="tk-t">$1</span>')
    .replace(/^(\s*[-*] |\s*\d+\. )/gm, '<span class="tk-m">$1</span>')
    .replace(/(\*\*[^*\n]+\*\*)/g, '<span class="tk-b">$1</span>')
    .replace(/(`[^`\n]+`)/g, '<span class="tk-c">$1</span>');
}

  else list.sort((a, b) => (order[a.status] - order[b.status]) || (DOCS.indexOf(a) - DOCS.indexOf(b)));

}
function bindFail(d) {
  const a = $("#retryBtn"), b = $("#retryPlain");
  if (a) a.addEventListener("click", () => { d.opts.ocr = true; renderInspector(); startConvert(d, true); });
  if (b) b.addEventListener("click", () => startConvert(d));

/* ============================================================
   인스펙터
   ============================================================ */
function renderInspector() {
  const d = getDoc(state.selected);
  const body = $("#inspBody");
  if (!d) {
    body.innerHTML = `<div class="empty" style="padding:56px 8px">
      <span class="ring">${icon("i-gear", "icon")}</span>

  }
  const o = d.opts;
  const unit = d.kind === "pptx" ? "슬라이드" : d.kind === "xlsx" ? "시트" : "쪽";
  body.innerHTML = `
    <div class="insp-sec">

        <div><dt>토큰 수</dt><dd>${d.tokens ? nf(d.tokens) : "—"}</dd></div>
        <div><dt>표 / 이미지</dt><dd>${d.tablesFound} / ${d.imagesFound}</dd></div>
        <div><dt>엔진</dt><dd>${esc(d.engine)}</dd></div>
      </dl>
    </div>

    <div class="insp-sec">
      <h3>추출 옵션</h3>
      <div class="switchrow">
        <span class="txt"><b>OCR 사용</b><span>텍스트 레이어가 없는 스캔 문서를 이미지에서 인식</span></span>
        <button class="sw" role="switch" data-opt="ocr" aria-checked="${o.ocr}" aria-label="OCR 사용"></button>
      </div>
      <div class="switchrow" style="margin-bottom:12px">

        <button class="sw" role="switch" data-opt="strip" aria-checked="${o.strip}" aria-label="머리글 바닥글 제거"></button>
      </div>
      <div class="opt">
        <label for="optTables">표 추출 방식</label>
        <select id="optTables" data-opt="tables">
          <option value="markdown" ${o.tables === "markdown" ? "selected" : ""}>Markdown 표</option>
          <option value="html" ${o.tables === "html" ? "selected" : ""}>HTML 표 (병합 셀 보존)</option>
          <option value="csv" ${o.tables === "csv" ? "selected" : ""}>CSV 블록</option>
        </select>
        <span class="desc">병합 셀이 많은 문서는 HTML 표가 구조를 더 정확히 보존합니다.</span>
      </div>
      <div class="opt">
        <label for="optImages">이미지 처리</label>
        <select id="optImages" data-opt="images">
          <option value="reference" ${o.images === "reference" ? "selected" : ""}>상대 경로로 참조</option>
          <option value="caption" ${o.images === "caption" ? "selected" : ""}>캡션만 남기기</option>
          <option value="skip" ${o.images === "skip" ? "selected" : ""}>제외</option>
        </select>
      </div>
      <div class="rangerow">
        <span class="top"><b>청크 크기</b><output id="chunkOut">${o.chunk} 토큰</output></span>

    sw.setAttribute("aria-checked", String(on));
    d.opts[sw.dataset.opt] = on;
    markDirty(d);
  }));
  $("#inspReconvert").addEventListener("click", () => startConvert(d));

function onOptChange(e) {
  const t = e.target;
  if (!t.dataset.opt) return;
  const d = getDoc(state.selected);
  if (!d) return;
  d.opts[t.dataset.opt] = t.type === "range" ? Number(t.value) : t.value;
  markDirty(d);
}
function markDirty(d) {
  if (d.status !== "done") return;
  d.dirty = true;
  renderViewer();
}

/* ============================================================
   변환 시뮬레이션
   ============================================================ */
const timers = new Map();

function startConvert(d, forceSuccess) {
  if (timers.has(d.id)) return;
  d.status = "run"; d.progress = 0; d.dirty = false; d.time = "변환 중"; d.elapsed = "—";
  if (forceSuccess && d.error) {
    d.error = null;
    d.pages = 12; d.tablesFound = 3; d.imagesFound = 12;
    d.snippet = "OCR로 이미지에서 텍스트를 인식했습니다. 인보이스 항목 표와 합계 행이 구조화되어 추출되었습니다.";
    d.fields = [
      ["문서 종류", "세금계산서 / 인보이스 (OCR 인식)", 88],
      ["인식 방식", "OCR · 한국어 + 영어", 99],
      ["항목 행", "34행", 84],
      ["합계 금액", "문서에 표기된 값 그대로 보존", 91],
      ["저신뢰 셀", "6개 — 검수 권장", 100]
    ];
    d.md = `---
title: 스캔 인보이스 (2026-08)
extraction: OCR
confidence: medium
source: scanned_invoice_2026-08.pdf
---

# 스캔 인보이스 (2026년 8월)

> OCR로 인식한 결과입니다. 아래 표에는 신뢰도가 낮은 셀이 6개 포함되어 있어 원본과 대조 검수를 권장합니다.

## 인보이스 정보

| 항목 | 값 |
| --- | --- |
| 발행일 | 2026-08-28 |
| 인보이스 번호 | INV-2026-0831 |
| 통화 | KRW |

## 항목

| 번호 | 품목 | 수량 | 단가 | 금액 |
| --- | --- | --- | --- | --- |
| 1 | 클라우드 사용료 (8월) | 1 | 1,840,000 | 1,840,000 |
| 2 | 추가 스토리지 500GB | 1 | 120,000 | 120,000 |
| 3 | 기술 지원 (표준) | 1 | 350,000 | 350,000 |

## 비고

원본 하단의 직인 이미지는 \`images/seal-1.png\` 로 분리 저장되었습니다.`;
  }
  render();
  updateStatusBar();

  const t = setInterval(() => {
    d.progress = Math.min(100, d.progress + 6 + Math.random() * 10);
    if (d.progress >= 100) {
      clearInterval(t); timers.delete(d.id);
      d.status = "done"; d.progress = 100; d.time = "방금 전";
      d.elapsed = (1.2 + Math.random() * 6).toFixed(1) + "초";
      if (!d.tokens) d.tokens = Math.round(600 + Math.random() * 6000);
      toast("ok", d.name, "변환 완료 · " + nf(d.tokens) + " 토큰");
      startNextQueued();
    }
    render();
    updateStatusBar();
  }, 420);
  timers.set(d.id, t);
}

function startNextQueued() {
  if (timers.size) return;
  const next = DOCS.find((d) => d.status === "queued");
  if (next) startConvert(next);
}

function enqueueNext() {
  const src = POOL[poolIndex % POOL.length];
  poolIndex++;
  const d = doc(Object.assign({}, src, {
    status: "queued", progress: 0, time: "대기 중",
    created: "방금 전", elapsed: "—", tokens: 0,
    fields: src.fields.map((f) => f.slice())
  }));
  DOCS.unshift(d);
  state.selected = d.id;
  state.view = "queue"; state.status = "all";
  render();
  toast("ok", d.name, "변환 큐에 추가됨");
  startNextQueued();
}

/* ============================================================
   상태바
   ============================================================ */
function updateStatusBar() {
  const c = counts();
  const running = byStatus("run").length;
  const pending = byStatus("queued").length;
  $("#sbQueue").textContent = running || pending
    ? `변환 ${running}건 진행 · 대기 ${pending}건`
    : `큐 대기 없음 · 완료 ${c.done}건`;
  $("#sbDot").className = "dot" + (running ? " run" : "");
  const d = getDoc(state.selected);
  $("#sbTokens").textContent = d && d.tokens ? nf(d.tokens) + " 토큰" : "";
  $("#sbEngine").textContent = d ? "엔진 · " + d.engine : "엔진 · 레이아웃 분석 v2";
  const f = d && FOLDERS.find((x) => x.id === d.folder);
  $("#sbWatchText").textContent = f ? f.name : FOLDERS[0].name;
}

/* ============================================================
   토스트
   ============================================================ */
function toast(kind, title, sub) {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `${icon(kind === "ok" ? "i-check" : "i-alert", "icon")}
    <span class="od-fill"><b class="od-truncate">${esc(title)}</b>${sub ? `<span class="sub2">${esc(sub)}</span>` : ""}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ============================================================
   렌더 파이프라인
   ============================================================ */
function render() {
  renderNav();
  renderList();
  renderViewer();
  renderInspector();
  updateStatusBar();
}

function select(id, focusPane) {
  state.selected = id;
  const d = getDoc(id);
  if (d && d.status !== "done" && state.tab !== "render") setTab("render", true);
  if (window.matchMedia("(max-width: 768px)").matches && focusPane) app.dataset.pane = "viewer";
  render();
}

function setTab(tab, silent) {
  state.tab = tab;
  $$(".tab").forEach((t) => {
    const on = t.dataset.tab === tab;
    t.setAttribute("aria-selected", String(on));
    t.tabIndex = on ? 0 : -1;
  });
  $("#panel").setAttribute("aria-labelledby", "tab-" + tab);
  if (!silent) renderViewer();
}

$("#nav").addEventListener("click", (e) => {
  const head = e.target.closest(".nav-head");
  if (head) {
    collapsed[head.dataset.group] = head.getAttribute("aria-expanded") === "true";
    renderNav();
    return;
  }
  const it = e.target.closest(".nav-item");
  if (!it) return;
  state.view = it.dataset.view;
  state.status = "all";
  syncChips();
  if (window.matchMedia("(max-width: 768px)").matches) app.dataset.pane = "list";
  app.dataset.sidebar = "closed";
  $("#navToggle").setAttribute("aria-expanded", "false");
  render();
});

$("#docList").addEventListener("click", (e) => {
  const b = e.target.closest(".doc");
  if (b) select(b.dataset.id, true);
});

$("#docList").addEventListener("keydown", (e) => {
  if (!["ArrowDown", "ArrowUp", "Home", "End", "Enter", " "].includes(e.key)) return;
  const list = visibleDocs();
  if (!list.length) return;
  let i = list.findIndex((d) => d.id === state.selected);
  if (e.key === "Enter" || e.key === " ") {
    if (i >= 0) { e.preventDefault(); select(list[i].id, true); }
    return;
  }
  e.preventDefault();
  if (e.key === "Home") i = 0;
  else if (e.key === "End") i = list.length - 1;
  else if (e.key === "ArrowDown") i = i < 0 ? 0 : Math.min(list.length - 1, i + 1);
  else i = i < 0 ? 0 : Math.max(0, i - 1);
  select(list[i].id, false);
  const el = $(`.doc[data-id="${list[i].id}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
});

$$(".chip").forEach((c) => c.addEventListener("click", () => {
  state.status = c.dataset.status; syncChips(); renderList();
}));

const searchInput = $("#listSearch");
searchInput.addEventListener("input", () => {

  $("#clearSearch").hidden = !state.query;
  renderList();
});
$("#clearSearch").addEventListener("click", () => {
  searchInput.value = ""; state.query = ""; $("#clearSearch").hidden = true; renderList(); searchInput.focus();
});

const SORTS = [["modified", "수정일 기준 정렬"], ["name", "이름 기준 정렬"], ["size", "용량 기준 정렬"]];
$("#sortBtn").addEventListener("click", () => {

$$(".tab").forEach((t) => {
  t.addEventListener("click", () => setTab(t.dataset.tab));
  t.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();

    let i = tabs.indexOf(t) + (e.key === "ArrowRight" ? 1 : -1);

  });
});

$("#starBtn").addEventListener("click", () => {
  const d = getDoc(state.selected); if (!d) return;
  d.star = !d.star; render();
  toast("ok", d.name, d.star ? "즐겨찾기에 추가" : "즐겨찾기에서 제거");
});
$("#reconvertBtn").addEventListener("click", () => { const d = getDoc(state.selected); if (d) startConvert(d); });
$("#copyBtn").addEventListener("click", () => { const d = getDoc(state.selected); if (d) copyMd(d); });
$("#exportBtn").addEventListener("click", openExport);
$("#moreBtn").addEventListener("click", () => toast("ok", "추가 명령", "Ctrl+K 팔레트에서 모든 명령을 실행할 수 있습니다"));
$("#deleteBtn").addEventListener("click", () => {
  const d = getDoc(state.selected); if (!d) return;
  const i = DOCS.indexOf(d);
  if (timers.has(d.id)) { clearInterval(timers.get(d.id)); timers.delete(d.id); }
  DOCS.splice(i, 1);
  const next = visibleDocs()[0];
  state.selected = next ? next.id : null;
  render();
  toast("ok", d.name, "큐에서 제거되었습니다");
});

function copyMd(d) {
  const write = navigator.clipboard && navigator.clipboard.writeText
    ? navigator.clipboard.writeText(d.md)
    : Promise.reject();
  write.then(
    () => toast("ok", "클립보드에 복사됨", d.name + " · " + nf(d.md.length) + "자"),
    () => toast("err", "복사하지 못했습니다", "브라우저가 클립보드 접근을 차단했습니다")
  );
}

   내보내기 다이얼로그
   ============================================================ */
const exportOverlay = $("#exportOverlay");
let lastFocus = null;

function openExport() {
  const d = getDoc(state.selected);
  if (!d || d.status !== "done") return;
  lastFocus = document.activeElement;
  $("#exportSub").textContent = `${d.name} · ${nf(d.tokens)} 토큰 · 표 ${d.tablesFound}개`;
  exportOverlay.hidden = false;
  $("#exportForm").querySelector('input[name="fmt"]').focus();
}
function closeExport() {
  exportOverlay.hidden = true;
  if (lastFocus) lastFocus.focus();
}
$$("[data-close]", exportOverlay).forEach((b) => b.addEventListener("click", closeExport));
exportOverlay.addEventListener("mousedown", (e) => { if (e.target === exportOverlay) closeExport(); });
$("#exportForm").addEventListener("change", () => {
  const clip = $("#exportForm").querySelector('input[name="fmt"]:checked').value === "clip";
  $("#pathRow").hidden = clip;
});
$("#exportForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const d = getDoc(state.selected);
  const fmt = $("#exportForm").querySelector('input[name="fmt"]:checked').value;
  closeExport();
  if (fmt === "clip") { copyMd(d); return; }
  const ext = fmt === "md" ? ".md" : ".jsonl";
  const base = d.name.replace(/\.[^.]+$/, "") + ext;
  toast("ok", base, $("#exportPath").value + "\\" + base + " 에 저장됨");
});

const paletteOverlay = $("#paletteOverlay");

const COMMANDS = [
  { t: "파일 추가 및 변환 시작", s: "Ctrl+N", run: enqueueNext },

  { t: "Markdown 내보내기", s: "Ctrl+E", run: openExport },

  { t: "추출 필드 탭으로 이동", s: "", run: () => setTab("fields") },
  { t: "변환 큐 보기", s: "", run: () => { state.view = "queue"; state.status = "all"; syncChips(); render(); } },
  { t: "실패한 문서 보기", s: "", run: () => { state.view = "failed"; state.status = "all"; syncChips(); render(); } },
  { t: "라이트 / 다크 모드 전환", s: "", run: () => $("#themeToggle").click() }
];

function openPalette() {
  lastFocus = document.activeElement;
  paletteOverlay.hidden = false;
  paletteInput.value = "";
  renderPalette("");
  paletteInput.focus();
}
function closePalette() {
  paletteOverlay.hidden = true;
  if (lastFocus) lastFocus.focus();
}
function renderPalette(q) {
  q = q.trim().toLowerCase();
  const docs = DOCS.filter((d) => !q || d.name.toLowerCase().includes(q) || d.snippet.toLowerCase().includes(q)).slice(0, 6);
  const cmds = COMMANDS.filter((c) => !q || c.t.toLowerCase().includes(q));
  pItems = [
    ...docs.map((d) => ({ kind: "doc", d, run: () => select(d.id, true) })),
    ...cmds.map((c) => ({ kind: "cmd", c, run: c.run }))
  ];
  pActive = 0;
  const list = $("#paletteList");
  if (!pItems.length) {
    list.innerHTML = `<div class="empty" style="padding:32px 20px">
      <h3>결과가 없습니다</h3><p>다른 검색어를 입력하거나 명령 이름의 일부만 입력해 보세요.</p></div>`;
    return;
  }
  let html = "";
  if (docs.length) {
    html += `<div class="palette-group">문서</div>` + docs.map((d, i) => `
      <button class="pcmd" data-i="${i}" data-active="${i === 0}">
        <span class="fmt ${d.kind}" aria-hidden="true">${KIND[d.kind]}</span>
        <span class="t">${esc(d.name)}</span>
        <span class="s">${STATUS[d.status].label}</span>
      </button>`).join("");
  }
  if (cmds.length) {
    html += `<div class="palette-group">명령</div>` + cmds.map((c, j) => {
      const i = docs.length + j;
      return `<button class="pcmd" data-i="${i}" data-active="${i === 0}">
        ${icon("i-sparkle", "icon icon-sm")}<span class="t">${esc(c.t)}</span>
        ${c.s ? `<span class="s">${esc(c.s)}</span>` : ""}
      </button>`;
    }).join("");
  }
  list.innerHTML = html;
}
function movePalette(dir) {
  if (!pItems.length) return;
  pActive = (pActive + dir + pItems.length) % pItems.length;
  $$(".pcmd").forEach((b) => b.dataset.active = String(Number(b.dataset.i) === pActive));
  const el = $(`.pcmd[data-i="${pActive}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
}
function runPalette() {
  const it = pItems[pActive];
  if (!it) return;
  closePalette();
  it.run();
}
paletteInput.addEventListener("input", () => renderPalette(paletteInput.value));
paletteInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); movePalette(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); movePalette(-1); }
  else if (e.key === "Enter") { e.preventDefault(); runPalette(); }
});
$("#paletteList").addEventListener("click", (e) => {
  const b = e.target.closest(".pcmd");
  if (!b) return;
  pActive = Number(b.dataset.i); runPalette();
});
paletteOverlay.addEventListener("mousedown", (e) => { if (e.target === paletteOverlay) closePalette(); });
$("#paletteOpen").addEventListener("click", openPalette);

/* ============================================================
   전역 키보드
   ============================================================ */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!paletteOverlay.hidden) { closePalette(); return; }
    if (!exportOverlay.hidden) { closeExport(); return; }
    if (app.dataset.sidebar === "open" || app.dataset.inspector === "open") {
      app.dataset.sidebar = "closed"; app.dataset.inspector = "closed";
      $("#navToggle").setAttribute("aria-expanded", "false");
    }
    return;
  }
  if (!e.ctrlKey && !e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === "k") { e.preventDefault(); paletteOverlay.hidden ? openPalette() : closePalette(); }
  else if (k === "n") { e.preventDefault(); enqueueNext(); }
  else if (k === "r" && !e.shiftKey) { const d = getDoc(state.selected); if (d) { e.preventDefault(); startConvert(d); } }
  else if (k === "e") { e.preventDefault(); openExport(); }
  else if (k === "f") { e.preventDefault(); searchInput.focus(); searchInput.select(); }
});

/* ============================================================
   드래그 앤 드롭
   ============================================================ */
const dropOverlay = $("#dropOverlay");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  e.preventDefault(); dragDepth++; dropOverlay.hidden = false;
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) dropOverlay.hidden = true;
});
window.addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; dropOverlay.hidden = true;
  const n = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files.length : 0;
  const add = Math.max(1, Math.min(n || 1, 3));
  for (let i = 0; i < add; i++) enqueueNext();
});

/* ============================================================
   시작
   ============================================================ */
state.selected = DOCS[0].id;
syncChips();
setTab("render", true);
render();
const running = DOCS.find((d) => d.status === "run");
if (running) { running.status = "queued"; startConvert(running); }
})();
</script>
</body>
</html>
