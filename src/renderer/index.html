<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- 앱은 원격 콘텐츠를 싣지 않는다. 기본값을 전부 닫고 자기 자원만 허용한다. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<title>Mark Extract</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/primitives.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/components.css">
</head>
<body>

<svg class="sr" aria-hidden="true"><defs>
  <symbol id="i-files" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 2.6 17.1A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 16.5h.01"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6a2 2 0 0 1 1.5.7l1 1.3H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h14"/><path d="M4 12h9"/><path d="M4 17h5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12"/><path d="m18 6-12 12"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-13.7-5L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 13.7 5L21 15"/><path d="M21 20v-5h-5"/></symbol>
  <symbol id="i-loader" viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M12 17v4"/><path d="m5.6 5.6 2.9 2.9"/><path d="m15.5 15.5 2.9 2.9"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m5.6 18.4 2.9-2.9"/><path d="m15.5 8.5 2.9-2.9"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h14"/><path d="M5 15h14"/><path d="M10 4 8.5 20"/><path d="M15.5 4 14 20"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 17-5-5 5-5"/><path d="m15 7 5 5-5 5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
  <!-- 톱니는 build.36 에서 다시 그렸다. 전의 경로는 손으로 이은 곡선이 어긋나
       16px 에서 톱니가 아니라 덩어리로 보였다. 8개 톱니를 계산해 만든 경로다. -->
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.21 4.82L10.50 2.52L13.50 2.52L13.79 4.82A7.4 7.4 0 0 1 15.81 5.66L17.64 4.23L19.77 6.36L18.34 8.19A7.4 7.4 0 0 1 19.18 10.21L21.48 10.50L21.48 13.50L19.18 13.79A7.4 7.4 0 0 1 18.34 15.81L19.77 17.64L17.64 19.77L15.81 18.34A7.4 7.4 0 0 1 13.79 19.18L13.50 21.48L10.50 21.48L10.21 19.18A7.4 7.4 0 0 1 8.19 18.34L6.36 19.77L4.23 17.64L5.66 15.81A7.4 7.4 0 0 1 4.82 13.79L2.52 13.50L2.52 10.50L4.82 10.21A7.4 7.4 0 0 1 5.66 8.19L4.23 6.36L6.36 4.23L8.19 5.66A7.4 7.4 0 0 1 10.21 4.82Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9"/><path d="M17 7h3"/><circle cx="15" cy="7" r="2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2.5 4.5 13.5H11l-.5 8L19 10.5h-6.5Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7"/><path d="M6.5 7 7.3 19a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 19V8"/><path d="m7.5 12.5 4.5-4.5 4.5 4.5"/><path d="M4 5h16"/></symbol>
</defs></svg>

<div class="app" id="app" data-pane="list" data-inspector="closed">

  <!-- ============== Windows 캡션바 ==============
       build.36: 명령 팔레트·다크 모드 버튼을 뺐다. 테마는 설정 → 일반에 있다.
       남은 것은 앱 전체에 걸리는 두 동작뿐이다 — 문서를 넣는 것과 설정. -->
  <header class="titlebar">
    <div class="tb-brand">
      <span class="tb-mark" aria-hidden="true">M</span>
      <span class="tb-name">MarkExtract</span>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-right">
      <button class="tb-tool" id="newMd" title="새 Markdown 문서 (Ctrl+N)">
        <svg class="icon icon-sm"><use href="#i-files"/></svg><span>새 문서</span>
      </button>
      <button class="tb-tool" id="addFile">
        <svg class="icon icon-sm"><use href="#i-plus"/></svg><span>파일 추가</span>
      </button>
      <button class="tb-tool" id="tbSettings">
        <svg class="icon icon-sm"><use href="#i-gear"/></svg><span>설정</span>
      </button>
      <div class="caption">
        <button type="button" id="capMin" aria-label="최소화"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
        <button type="button" id="capMax" aria-label="최대화"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
        <button type="button" id="capClose" class="close" aria-label="닫기"><svg viewBox="0 0 10 10"><path d="m0 0 10 10M10 0 0 10"/></svg></button>
      </div>
    </div>
  </header>

  <!-- ============== 워크스페이스 ============== -->
  <div class="workspace">
    <div class="scrim" id="scrim"></div>

    <!-- 문서 목록. build.36 에서 좌측 사이드바를 걷어 냈다 — 상태 보기가 사이드바와
         목록 위 칩 두 곳에 있었고, 형식별 보기는 카드에 형식이 이미 적혀 있다. -->
    <section class="listpane" aria-label="문서 목록">
      <div class="list-head">
        <h1 class="list-title">문서</h1>
        <button class="icon-btn" id="sortBtn" title="정렬: 추가순" aria-label="정렬 기준 변경">
          <svg class="icon"><use href="#i-sort"/></svg>
        </button>
      </div>
      <div class="list-filter">
        <div class="search">
          <svg class="icon icon-sm"><use href="#i-search"/></svg>
          <label class="sr" for="listSearch">문서 검색</label>
          <input id="listSearch" type="text" placeholder="파일명 또는 미리보기 검색" autocomplete="off">
          <button class="icon-btn tiny" id="clearSearch" hidden aria-label="검색어 지우기">
            <svg class="icon icon-sm"><use href="#i-x"/></svg>
          </button>
        </div>
        <div class="chips" role="group" aria-label="상태 필터">
          <button class="chip" data-status="all" aria-pressed="true">전체 <span class="n" data-count="all"></span></button>
          <button class="chip" data-status="active" aria-pressed="false">진행 중 <span class="n" data-count="active"></span></button>
          <button class="chip" data-status="done" aria-pressed="false">완료 <span class="n" data-count="done"></span></button>
          <button class="chip" data-status="failed" aria-pressed="false">확인 필요 <span class="n" data-count="failed"></span></button>
        </div>
      </div>
      <div class="doclist od-scroll" id="docList" role="listbox" aria-label="문서" tabindex="0"><!-- JS --></div>
    </section>

    <!-- 메인 뷰어 -->
    <main class="viewer" aria-label="변환 결과">
      <div class="viewer-bar">
        <button class="icon-btn back-to-list" id="backToList" aria-label="목록으로 돌아가기">
          <svg class="icon"><use href="#i-left"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <button class="icon-btn" id="reconvertBtn" title="재변환" aria-label="재변환"><svg class="icon"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="copyBtn" title="Markdown 복사" aria-label="Markdown 복사"><svg class="icon"><use href="#i-copy"/></svg></button>
        <button class="icon-btn" id="exportBtn" title="내보내기" aria-label="내보내기"><svg class="icon"><use href="#i-down"/></svg></button>
        <button class="icon-btn" id="revealBtn" title="원본 폴더 열기" aria-label="원본 폴더 열기"><svg class="icon"><use href="#i-folder"/></svg></button>
        <button class="icon-btn" id="deleteBtn" title="목록에서 제거" aria-label="목록에서 제거"><svg class="icon"><use href="#i-trash"/></svg></button>
        <span class="vbar-div" aria-hidden="true"></span>
        <button class="tb-tool opt-toggle" id="inspectorToggle" aria-pressed="false" aria-controls="inspector">
          <svg class="icon icon-sm"><use href="#i-sliders"/></svg><span>옵션</span>
        </button>
      </div>

      <div class="tabs" role="tablist" aria-label="결과 보기 방식">
        <button class="tab" role="tab" id="tab-render" aria-controls="panel" aria-selected="true" data-tab="render">미리보기</button>
        <button class="tab" role="tab" id="tab-source" aria-controls="panel" aria-selected="false" data-tab="source" tabindex="-1">Markdown</button>
        <button class="tab" role="tab" id="tab-log" aria-controls="panel" aria-selected="false" data-tab="log" tabindex="-1">
          <span>변환 로그</span><span class="n" id="warnCount"></span>
        </button>
      </div>

      <div class="od-scroll" id="panelScroll">
        <div id="dirtyBar"></div>
        <div id="panel" role="tabpanel" aria-labelledby="tab-render"><!-- JS --></div>
      </div>

      <!-- md 편집기 (build.38). 다시 그리는 #panel 밖에 고정으로 둔다 — 안에 두면 목록이
           바뀔 때마다 커서와 실행 취소 기록이 날아간다 (views/editor.ts). -->
      <div class="editor" id="editor" hidden>
        <label class="sr" for="editText">Markdown 편집</label>
        <textarea id="editText" spellcheck="false" autocomplete="off"></textarea>
        <div class="edit-preview od-scroll" id="editPreview" aria-label="미리보기"></div>
      </div>
    </main>

    <!-- 변환 옵션. 기본은 닫혀 있고 뷰어의 [옵션] 으로 연다 (build.36). 옵션은 문서마다
         바꾸는 일이 드물어 늘 자리를 차지할 이유가 없다. -->
    <aside class="inspector" id="inspector" aria-label="변환 옵션">
      <div class="insp-head">
        <h2>변환 옵션</h2>
        <button class="icon-btn" id="inspClose" aria-label="변환 옵션 닫기">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="insp-body od-scroll" id="inspBody"><!-- JS --></div>
    </aside>
  </div>

</div>

<!-- ============== 내보내기 다이얼로그 ============== -->
<div class="overlay" id="exportOverlay" hidden>
  <form class="dialog" id="exportForm" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <h2 id="exportTitle">Markdown 내보내기</h2>
    <p class="sub" id="exportSub"></p>
    <div class="body">
      <!-- 시제품의 JSONL 선택지는 뺐다. 출력은 Markdown 전용이다 (결정 3).
           이미지 참조 여부도 뺐다 — 그것은 변환 옵션이라 인스펙터에 있고,
           이미 변환된 결과를 내보낼 때 바꿀 수 있는 것이 아니다. -->
      <fieldset>
        <legend>출력 형식</legend>
        <label class="radio"><input type="radio" name="fmt" value="md" checked>
          <span class="txt"><b>Markdown (.md)</b><span>문서마다 파일 하나. 이름이 겹치면 -1 을 붙입니다</span></span></label>
        <label class="radio"><input type="radio" name="fmt" value="clip">
          <span class="txt"><b>클립보드에 복사</b><span>파일을 만들지 않고 바로 붙여넣기</span></span></label>
      </fieldset>
      <fieldset>
        <legend>포함 항목</legend>
        <label class="check"><input type="checkbox" id="optFm" checked>
          <span class="txt"><b>YAML 프런트매터</b><span>제목, 출처, 페이지 수 등 메타데이터</span></span></label>
      </fieldset>
      <div class="opt" id="pathRow">
        <label for="exportPath">저장 위치</label>
        <div class="od-row">
          <input class="od-fill" id="exportPath" type="text" placeholder="폴더를 선택하세요" readonly>
          <button type="button" class="btn od-fixed" id="exportBrowse">찾아보기</button>
        </div>
      </div>
    </div>
    <div class="foot">
      <button type="button" class="btn" data-close>취소</button>
      <button type="submit" class="btn primary">내보내기</button>
    </div>
  </form>
</div>

<!-- ============== 설정 ==============
     원본에 없다 (docs/design/04-ui-spec.md). 원본의 다이얼로그 스타일을 그대로 쓴다.
     내용은 JS 가 채운다 — 값이 설정에서 오고 절이 여럿이라 마크업을 손으로 두면
     화면과 저장값이 어긋나기 쉽다. -->
<!-- ============== 자체 점검 ==============
     사내 PC 에서 확인할 수 있는 것을 한 자리에 모아 보여 준다. 명령 프롬프트로도
     돌릴 수 있지만(--self-test), 단일 exe 는 stdout 이 호출자에게 닿지 않아
     화면에 아무것도 안 뜬다. 그래서 앱 안에 둔다. -->
<div class="overlay" id="selfTestOverlay" hidden>
  <div class="dialog selftest-dialog" role="dialog" aria-modal="true" aria-labelledby="selfTestTitle">
    <h2 id="selfTestTitle">자체 점검</h2>
    <p class="sub">동봉 JRE·시험 자료 변환·LLM CLI·OCR 서버·설정 경로를 확인합니다.</p>
    <div class="body od-scroll">
      <pre class="cli-report"><code id="selfTestOut">점검하는 중입니다… 처음에는 자바가 뜨느라 몇 초 걸립니다.</code></pre>
    </div>
    <div class="foot">
      <button type="button" class="btn" id="selfTestCopy">결과 복사</button>
      <button type="button" class="btn primary" data-close>닫기</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay" hidden>
  <div class="dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">설정</h2>
    <div class="settings-tabs" role="tablist" aria-label="설정 구분">
      <button class="tab" role="tab" data-pane="convert" aria-selected="true">변환</button>
      <button class="tab" role="tab" data-pane="llm" aria-selected="false">LLM</button>
      <button class="tab" role="tab" data-pane="ocr" aria-selected="false">OCR</button>
      <button class="tab" role="tab" data-pane="general" aria-selected="false">일반</button>
    </div>
    <div class="body od-scroll" id="settingsBody"><!-- JS --></div>
    <div class="foot">
      <span class="settings-note od-fill" id="settingsNote">바꾸면 바로 저장됩니다.</span>
      <button type="button" class="btn primary" id="settingsClose">닫기</button>
    </div>
  </div>
</div>

<!-- ============== 드롭 오버레이 ============== -->
<div class="drop" id="dropOverlay" hidden>
  <div class="drop-in">
    <svg class="icon"><use href="#i-upload"/></svg>
    <b>여기에 놓으면 변환합니다</b>
    <span>PDF · DOCX · XLSX · XLS · PPTX · HTML · EML</span>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
