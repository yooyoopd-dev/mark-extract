# docs/design/05-packaging.md 명세.
appId: dev.yooyoopd.markextract
productName: Mark Extract
directories:
  output: dist
files:
  - out/**
  # kordoc 이 runtime dependency 라 그 의존성 트리가 통째로 들어온다. 우리가
  # 쓰는 것은 DOCX·XLSX·XLS 경로뿐이라 나머지를 덜어낸다. 제외가 안전한지는
  # --self-test 가 패키징된 앱에서 다섯 형식을 모두 돌려 확인한다.
  #
  # PDF 는 opendataloader 몫이므로 kordoc 의 PDF 경로가 필요 없다.
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/@hyzyla/**"
  # kordoc 의 MCP 서버(kordoc-mcp)는 우리가 쓰지 않는다. 라이브러리를 직접 부른다.
  - "!node_modules/@modelcontextprotocol/**"
  - "!node_modules/hono/**"
  - "!node_modules/@hono/**"
  - "!node_modules/jose/**"
  - "!node_modules/zod-to-json-schema/**"
  # OCR·이미지 처리. 설치되지 않지만 막아 둔다.
  - "!node_modules/onnxruntime-node/**"
  - "!node_modules/sharp/**"
  - "!node_modules/@huggingface/**"

# 동봉 JRE 와 JAR. 자바는 asar 가상 파일 시스템 안의 파일을 실행하거나 읽지 못하므로
# asar 바깥(앱의 resources/)에 그대로 둔다. 어댑터는 packaged 일 때
# process.resourcesPath 를 기준으로 찾는다.
extraResources:
  - from: resources/jre
    to: jre
  - from: resources/lib
    to: lib
  # --self-test 를 인자 없이 돌릴 수 있게 한글 시험 자료를 함께 넣는다 (약 220KB).
  - from: test/fixtures
    to: fixtures
    filter:
      - "sample-ko.*"
      - "!*.html"

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: MarkExtract-${version}.exe

# 단일 exe 는 실행할 때마다 %TEMP% 로 약 280MB 를 푼다. 그 동안에는 우리 JS 가 한
# 줄도 돌지 않으므로 BrowserWindow 스플래시로 덮을 수 없다 — NSIS 스텁이 띄우는
# 이 비트맵이 그 구간을 덮는 유일한 수단이다 (docs/design/05-packaging.md#첫-실행).
portable:
  splashImage: build/splash.bmp
  # 실행할 때마다 압축을 푸는 시간을 20.5초에서 10.7초로 줄인다 (run 21 실측).
  #
  # 기본 경로는 app-64.7z(LZMA)를 exe 에 넣고, 실행 시 Nsis7z 로 임시 폴더에 푼 뒤
  # CopyFiles 로 한 번 더 옮긴다 — 같은 양을 디스크에 두 번 쓴다. useZip 은 NSIS 의
  # `File /r` 가지를 태워 zlib 로 목적지에 곧장 풀고, 그 두 번째 복사가 사라진다.
  #
  # 맞바꿈은 exe 크기다: 173MB → 264.8MB. 사내 배포는 한 번 받아 계속 쓰는 쪽이라
  # 내려받기 한 번보다 매 실행 10초가 비싸다 (docs/design/05-packaging.md#첫-실행).
  useZip: true
